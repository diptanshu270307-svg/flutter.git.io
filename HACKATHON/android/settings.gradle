pluginManagement {
    // Flutter writes the SDK location into local.properties automatically
    // the first time you run `flutter run` / `flutter build`.
    def flutterSdkPath = {
        def properties = new Properties()
        def localProps = file("local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in android/local.properties — run `flutter pub get` from the project root first."
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"

