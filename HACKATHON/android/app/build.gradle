plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // If using any Firebase; remove if not needed
}

android {
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.finmesh.app"
        minSdk 24            // BiometricPrompt requires API 23+; Nearby works best with 24+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    // ── AndroidX Core ────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ── Biometric (Phase 2) ──────────────────────────────────────
    implementation 'androidx.biometric:biometric:1.1.0'

    // ── Google Nearby Connections (Phase 3) ──────────────────────
    implementation 'com.google.android.gms:play-services-nearby:19.1.0'

    // ── Security Crypto (optional: encrypted SharedPreferences) ──
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ── Gson (for JSON serialization of payment data) ────────────
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── Testing ──────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
